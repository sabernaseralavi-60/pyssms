name: release
# Publishes to PyPI with Trusted Publishing (OIDC): no token or password is stored anywhere.
# One-time setup on pypi.org (account > Publishing > "Add a new pending publisher"):
#   project name pyssms | owner sabernaseralavi-60 | repository pyssms | workflow release.yml | environment pypi
# Trigger: publishing a GitHub release, or running the workflow by hand (workflow_dispatch).
# A published version number can never be reused: bump the version before every release.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
